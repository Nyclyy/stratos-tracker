name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      severity:
        description: 'Update severity published in the manifest'
        type: choice
        options: [normal, important, critical]
        default: normal
      reason:
        description: 'Why a critical update is required (required for critical)'
        type: string
        required: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          # The changelog is built from the commits between the previous tag and
          # this one, so the runner needs the tags and their history.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node dependencies
        run: npm ci

      # Every build up to 2.1.5 reported version 2.1.0, so an installed copy could
      # not be told apart from another release. Stamp the tag into the app and the
      # bridge so Settings and the Windows installer both show the real version.
      # The repository now carries the release version itself, so the stamp has to
      # tolerate a tag that matches what is already committed.
      - name: Stamp the release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version --no-git-tag-version --allow-same-version "$VERSION" --silent
          python scripts/stamp-version.py "$VERSION"

      # The build's own tests assert that the published manifest names the
      # version the app reports, so the notes are created before they run. The
      # installer URL, size and checksum are attached later, once they exist.
      - name: Generate release notes and update manifest
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          SEVERITY: ${{ github.event.inputs.severity || 'normal' }}
          CRITICAL_REASON: ${{ github.event.inputs.reason }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PREVIOUS=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          ARGS=(--version "$VERSION" --severity "$SEVERITY" --markdown dist/release-notes.md)
          if [ -n "$PREVIOUS" ]; then ARGS+=(--from "$PREVIOUS"); fi
          if [ "$SEVERITY" = "critical" ]; then ARGS+=(--reason "$CRITICAL_REASON"); fi
          node scripts/release-notes.mjs "${ARGS[@]}"
          node scripts/release-notes.mjs --check

      - name: Run JavaScript and relay tests
        run: npm test

      - name: Run bridge tests
        run: python -m unittest -v tests.test_bridge

      - name: Run bridge + relay integration test
        run: npm run test:integration

      - name: Build standalone simulator bridge
        run: |
          python -m pip install --disable-pip-version-check pyinstaller
          pyinstaller --noconfirm --clean --onefile --name stratos-bridge --distpath bridge-dist --workpath build/pyinstaller --specpath build stratos_bridge.py
          if (!(Test-Path "bridge-dist\stratos-bridge.exe")) { throw "PyInstaller did not produce stratos-bridge.exe" }

      - name: Build Windows installer
        run: npm run dist:win

      - name: Verify installer and write checksum
        shell: pwsh
        run: |
          if (!(Test-Path "dist\Stratos-Setup.exe")) { throw "electron-builder did not produce Stratos-Setup.exe" }
          $size = (Get-Item "dist\Stratos-Setup.exe").Length
          if ($size -lt 30000000) { throw "Installer is unexpectedly small ($size bytes); app assets are probably missing" }
          # Without the update manifest, installed copies can never find a newer
          # release, so a build that cannot update is not a successful release.
          if (!(Test-Path "dist\latest.yml")) { throw "electron-builder did not produce latest.yml; automatic updates would be broken" }
          $hash = (Get-FileHash "dist\Stratos-Setup.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  Stratos-Setup.exe" | Set-Content -Encoding ascii "dist\Stratos-Setup.exe.sha256"
          Write-Host "Installer size: $size bytes"
          Write-Host "SHA256: $hash"

      # Now that the installer and its checksum exist, the manifest can name the
      # exact download. Re-running the generator updates the same release entry
      # instead of adding a second one; the notes stay the same because they come
      # from the same commit range.
      - name: Attach the installer to the manifest
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          SEVERITY: ${{ github.event.inputs.severity || 'normal' }}
          CRITICAL_REASON: ${{ github.event.inputs.reason }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PREVIOUS=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          HASH=$(cut -d' ' -f1 dist/Stratos-Setup.exe.sha256)
          SIZE=$(wc -c < dist/Stratos-Setup.exe)
          ARGS=(--version "$VERSION" --severity "$SEVERITY" --markdown dist/release-notes.md \
            --windows "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/Stratos-Setup.exe" \
            --sha256 "$HASH" --size "$SIZE")
          if [ -n "$PREVIOUS" ]; then ARGS+=(--from "$PREVIOUS"); fi
          if [ "$SEVERITY" = "critical" ]; then ARGS+=(--reason "$CRITICAL_REASON"); fi
          node scripts/release-notes.mjs "${ARGS[@]}"
          cp app/releases.json dist/releases.json
          node scripts/release-notes.mjs --check
          cat dist/release-notes.md

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stratos-Windows-Installer
          path: |
            dist/Stratos-Setup.exe
            dist/Stratos-Setup.exe.sha256
            dist/latest.yml
            dist/releases.json
            dist/release-notes.md
            dist/*.blockmap
          retention-days: 30

      - name: Publish installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Stratos-Setup.exe
            dist/Stratos-Setup.exe.sha256
            dist/latest.yml
            dist/releases.json
            dist/release-notes.md
            dist/*.blockmap
          body_path: dist/release-notes.md
          fail_on_unmatched_files: true

  # The release page existing is not proof that it is installable. This job reads
  # the published assets back and checks the manifest, checksum and installer
  # against each other, so a broken release cannot pass as the newest version.
  verify-release:
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the published release and manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-release.mjs "${GITHUB_REF_NAME#v}"
