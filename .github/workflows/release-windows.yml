name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node dependencies
        run: npm ci

      # Every build up to 2.1.5 reported version 2.1.0, so an installed copy could
      # not be told apart from another release. Stamp the tag into the app and the
      # bridge so Settings and the Windows installer both show the real version.
      # The repository now carries the release version itself, so the stamp has to
      # tolerate a tag that matches what is already committed.
      - name: Stamp the release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version --no-git-tag-version --allow-same-version "$VERSION" --silent
          python scripts/stamp-version.py "$VERSION"

      - name: Run JavaScript and relay tests
        run: npm test

      - name: Run bridge tests
        run: python -m unittest -v tests.test_bridge

      - name: Run bridge + relay integration test
        run: npm run test:integration

      - name: Build standalone simulator bridge
        run: |
          python -m pip install --disable-pip-version-check pyinstaller
          pyinstaller --noconfirm --clean --onefile --name stratos-bridge --distpath bridge-dist --workpath build/pyinstaller --specpath build stratos_bridge.py
          if (!(Test-Path "bridge-dist\stratos-bridge.exe")) { throw "PyInstaller did not produce stratos-bridge.exe" }

      - name: Build Windows installer
        run: npm run dist:win

      - name: Verify installer and write checksum
        shell: pwsh
        run: |
          if (!(Test-Path "dist\Stratos-Setup.exe")) { throw "electron-builder did not produce Stratos-Setup.exe" }
          $size = (Get-Item "dist\Stratos-Setup.exe").Length
          if ($size -lt 30000000) { throw "Installer is unexpectedly small ($size bytes); app assets are probably missing" }
          # Without the update manifest, installed copies can never find a newer
          # release, so a build that cannot update is not a successful release.
          if (!(Test-Path "dist\latest.yml")) { throw "electron-builder did not produce latest.yml; automatic updates would be broken" }
          $hash = (Get-FileHash "dist\Stratos-Setup.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  Stratos-Setup.exe" | Set-Content -Encoding ascii "dist\Stratos-Setup.exe.sha256"
          Write-Host "Installer size: $size bytes"
          Write-Host "SHA256: $hash"

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stratos-Windows-Installer
          path: |
            dist/Stratos-Setup.exe
            dist/Stratos-Setup.exe.sha256
            dist/latest.yml
            dist/*.blockmap
          retention-days: 30

      - name: Publish installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Stratos-Setup.exe
            dist/Stratos-Setup.exe.sha256
            dist/latest.yml
            dist/*.blockmap
          generate_release_notes: true
          fail_on_unmatched_files: true
