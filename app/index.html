<script type="module">
import { aircraftSprite } from './js/lib/aircraft.js';
const spriteAtlas = new Image();
spriteAtlas.src = 'images/aircraft/spritesheet.png';
const spriteCanvas = document.createElement('canvas');
spriteCanvas.width = spriteCanvas.height = 72;
const spriteCtx = spriteCanvas.getContext('2d');
const spriteCache = new Map();
function aircraftIcon(type, color) {
  const sprite = aircraftSprite(type);
  if (!sprite || !spriteAtlas.complete || !spriteAtlas.naturalWidth) return null;
  const key = `${sprite.name}:${color}`;
  if (spriteCache.has(key)) return spriteCache.get(key);
  const frameId = sprite.ids[0];
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = 72;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(spriteAtlas, (frameId % 8) * 72, Math.floor(frameId / 8) * 72, 72, 72, 0, 0, 72, 72);
  ctx.globalCompositeOperation = 'source-in';
  ctx.fillStyle = color;
  ctx.fillRect(0, 0, 72, 72);
  spriteCache.set(key, canvas);
  return canvas;
}
spriteAtlas.addEventListener('load', () => { spriteCache.clear(); window.dispatchEvent(new Event('aircraft-atlas-ready')); });
window.aircraftIcon = aircraftIcon;
</script>

/* The hand-off leaves Stratos for the page the PC serves, and a browser cannot
   undo a navigation that fails: if the PC is off, that address replaces the app
   with "this site can't be reached". So the offer waits for a tap, says which
   machine it opens, and can be put aside for this session. The Flight Deck it
   sits on works without the PC, so a phone with the sim off is never stranded. */

/* The bridge records the flight from the moment it starts, so a page opened
   halfway through can draw the real path instead of a contrail from the moment

   trail, so two unrelated flights are never joined by a line. */

    /* Landing completes the bridge's flight and the rollout starts a new one, so
       a new id is not a new journey. The bridge also opens that new record before
       it has written a point into it, so when the track is still empty the test
       uses where the aircraft is now: at the end of a rollout that is where the
       drawn trail stopped, and the line must stay. A flight started somewhere
       else (a reposition, a new session) is far from that point and still clears
       the old line. With no position to judge by, the trail is kept rather than
       erased on a guess. */

       so a touchdown cannot erase the flight that just ended. */

     replaces the local trail when it grows, so the departure end cannot be eaten

/* One lookup per registration or Mode S address per session. A failure is
   remembered as a failure, so a missing photo is not retried on every frame. */
async function fcPhoto(ref){
  if(!ref||PHOTOS.has(ref.key))return;
  if(ref.kind=='rep'){await fcRepPhoto(ref);return}
  PHOTOS.set(ref.key,{state:'loading'});
  // missingOn404 separates "the service has no photo for this airframe" from
  // "this deployment has no photo route at all", which are different answers.
  const ask=async(missingOn404,url)=>{
    let r;
    try{r=await fetch(url,{cache:'force-cache'})}catch(_){return {state:'unavailable'}}
    let payload=null;
    try{payload=await r.json()}catch(_){payload=null}
    if(missingOn404&&r.status===404)return {state:'none'};
    return window.PHOTO.photoOutcome(r.status,payload);
  };
  // The desktop build has no same-origin API; its main process supplies the
  // User-Agent the service requires, so the direct call is the working path there.
  const outcome=location.protocol==='file'
    ? await ask(true,ref.direct)
    : await ask(false,ref.url);
  PHOTOS.set(ref.key,outcome&&outcome.state?outcome:{state:'unavailable'});
  fCard();

    const q=/^\d+$/.test(id)?`userid=${encodeURIComponent(id)}`:`username=${encodeURIComponent(id)}`;
    const r=await fetch(`https://www.simbrief.com/api/xml.fetcher.php?${q}&json=v2`);

  finally{ofpBusy=false}
  if(ofp.documentUrl){open(ofp.documentUrl);return}
  if(failure){alert('The OFP could not be fetched: '+failure+' Check your connection, then press OFP again.');return}
  if(ofp.text){panel='fsum';fsTab='overview';render();alert('SimBrief published no PDF for this plan. The OFP text it returned is shown in the Flight summary.');return}

}

  if(ofp&&ofp.destination&&ofp.destination.icao)ids.push(ofp.destination.icao);
  if(!ids.length&&route.length>1)ids.push(route[0].id,route[route.length-1].id);
