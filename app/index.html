/* ── Premium pass ──────────────────────────────────────────────────
   Type, rhythm, controls and readouts. Uses only this page's tokens. */
:root{
  --r-sm:8px; --r-md:12px; --r-lg:18px;
  --sh-1:0 1px 2px rgba(0,0,0,.16),0 6px 18px rgba(0,0,0,.14);
  --sh-2:0 10px 30px rgba(0,0,0,.26);
  --t-fast:110ms; --t:160ms; --ease:cubic-bezier(.2,.7,.3,1);
}
html,body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{border-radius:var(--r-sm);min-height:34px;transition:background-color var(--t) var(--ease),border-color var(--t) var(--ease),color var(--t) var(--ease)}
button:hover{border-color:var(--acc)}
button.on{background:var(--acc);color:#06161d;border-color:var(--acc);border-radius:var(--r-sm)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#sb{box-shadow:var(--sh-1);border-radius:999px}
#res,#sheet,#lay,#cv{box-shadow:var(--sh-2)}
#res{border-radius:var(--r-md);overscroll-behavior:contain}
#res div{transition:background-color var(--t-fast) var(--ease)}
#res div:hover,#lay button:hover{background:var(--ui2)}
#sheet{border-radius:var(--r-lg)}
.tab{border-radius:var(--r-sm);transition:color var(--t) var(--ease),background-color var(--t) var(--ease)}
.tab.act{color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent);box-shadow:inset 0 2px 0 var(--acc)}
.fab{box-shadow:var(--sh-1)}
.fr,.fg b,.mg b,#tel b,.pill,.pb s,.fh i{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.fg b,.mg b{letter-spacing:-.03em;font-weight:750}
.fh,.pill{letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.mg>div{background:var(--ui2);border:1px solid color-mix(in srgb,var(--ui2) 60%,var(--coast));border-radius:var(--r-md);padding:12px 14px}
.mg .big b{font-size:32px;line-height:1.1}
table{font-size:13px}
th{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:700;position:sticky;top:0;background:var(--surface);z-index:1}
td,th{border-bottom:1px solid color-mix(in srgb,var(--ui2) 70%,transparent);padding:6px}
#sheet,#res,#ci{scrollbar-width:thin;scrollbar-color:var(--coast) transparent}

/* Application shell: a slim status bar and the career strip sit above the map.
   The map keeps its own overlays and rail; only the frame around it changes. */
.app-shell{display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:100dvh;min-height:0;background:var(--bg)}
.app-main{grid-row:2;display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0;overflow:hidden}

#tabs{grid-row:3;position:static;left:auto;right:auto;top:auto;bottom:auto;border-top:1px solid var(--ui2);border-radius:20px 20px 0 0;padding-bottom:max(6px,env(safe-area-inset-bottom));z-index:2}

/* World basemap: country outlines, country names, continent names and ocean

   offscreen canvas at a snapped centre and reused, so panning is a blit rather
   than re-pathing ~9,500 points; the margin keeps a snapped pan from exposing
   an edge. */

  const slon=wSnap(V.lon,WSTEP),slat=wSnap(V.lat,WSTEP),key=worldKeyNow();
  const p=wpx(V.lon,V.lat,V.z),ps=wpx(slon,slat,V.z);

    wcv.width=Math.max(1,Math.round((W+WM*2)*dpr));wcv.height=Math.max(1,Math.round((H+WM*2)*dpr));
